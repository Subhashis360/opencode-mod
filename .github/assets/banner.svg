<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Mod</title>
  <desc id="desc">The Settings → Mod screen of OpenCode Mod, showing the Session limits tab with free-tier status, current IP, reset timer and today's usage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B16"/>
      <stop offset="1" stop-color="#15183A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="1" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="window">
      <rect x="170" y="48" width="940" height="352" rx="16"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glowA)"/>
  <rect width="1280" height="440" fill="url(#glowB)"/>

  <g font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">
    <!-- App window -->
    <g filter="url(#shadow)">
      <rect x="170" y="48" width="940" height="352" rx="16" fill="#101329" stroke="#2B3060"/>
    </g>
    <g clip-path="url(#window)">
    <rect x="170" y="48" width="940" height="40" fill="#151937"/>
    <circle cx="196" cy="68" r="6" fill="#FF5F57"/>
    <circle cx="216" cy="68" r="6" fill="#FEBC2E"/>
    <circle cx="236" cy="68" r="6" fill="#28C840"/>
    <text x="640" y="73" fill="#8D93C4" font-size="13" text-anchor="middle">OpenCode Mod — Settings</text>
    <line x1="170" y1="88" x2="1110" y2="88" stroke="#2B3060"/>

    <!-- Sidebar -->
    <rect x="170" y="88" width="220" height="312" fill="#0D1024"/>
    <line x1="390" y1="88" x2="390" y2="400" stroke="#2B3060"/>
    <text x="194" y="118" fill="#6E74A8" font-size="11" font-weight="600" letter-spacing="1.2">MOD</text>
    <g font-size="13.5" fill="#B9BEE6">
      <text x="210" y="148">OpenCode Account</text>
      <rect x="186" y="160" width="190" height="30" rx="8" fill="#7C5CFF" fill-opacity="0.18" stroke="#7C5CFF" stroke-opacity="0.55"/>
      <text x="210" y="180" fill="#FFFFFF" font-weight="600">Session limits</text>
      <text x="210" y="212">Agents</text>
      <text x="210" y="242">System prompt</text>
      <text x="210" y="272">Permissions</text>
      <text x="210" y="302">MCP Servers</text>
      <text x="210" y="332">Commands</text>
      <text x="210" y="362">Experimental</text>
    </g>
    <g fill="#7C5CFF">
      <circle cx="198" cy="143" r="3"/>
      <circle cx="198" cy="175" r="3" fill="#22D3EE"/>
      <circle cx="198" cy="207" r="3"/>
      <circle cx="198" cy="237" r="3"/>
      <circle cx="198" cy="267" r="3"/>
      <circle cx="198" cy="297" r="3"/>
      <circle cx="198" cy="327" r="3"/>
      <circle cx="198" cy="357" r="3"/>
    </g>

    <!-- Main panel -->
    <text x="426" y="128" fill="#FFFFFF" font-size="22" font-weight="700">Session limits</text>
    <text x="426" y="152" fill="#8D93C4" font-size="13">Free-tier usage, the IP it counts against, and when it resets.</text>

    <!-- Status cards -->
    <g>
      <rect x="426" y="172" width="208" height="84" rx="12" fill="#151937" stroke="#2B3060"/>
      <text x="444" y="198" fill="#8D93C4" font-size="12">Status</text>
      <rect x="444" y="212" width="94" height="26" rx="13" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.6"/>
      <circle cx="460" cy="225" r="4" fill="#34D399"/>
      <text x="472" y="230" fill="#6EE7B7" font-size="13" font-weight="600">Available</text>

      <rect x="652" y="172" width="208" height="84" rx="12" fill="#151937" stroke="#2B3060"/>
      <text x="670" y="198" fill="#8D93C4" font-size="12">Current IP</text>
      <text x="670" y="232" fill="#FFFFFF" font-size="18" font-weight="600">203.0.113.42</text>

      <rect x="878" y="172" width="208" height="84" rx="12" fill="#151937" stroke="#2B3060"/>
      <text x="896" y="198" fill="#8D93C4" font-size="12">Resets in</text>
      <text x="896" y="232" fill="#FFFFFF" font-size="18" font-weight="600">9h 12m</text>
    </g>

    <!-- Usage -->
    <rect x="426" y="274" width="660" height="104" rx="12" fill="#151937" stroke="#2B3060"/>
    <text x="444" y="302" fill="#8D93C4" font-size="12">Used today</text>
    <text x="444" y="330" fill="#FFFFFF" font-size="20" font-weight="700">37 requests</text>
    <text x="574" y="330" fill="#8D93C4" font-size="14">· 412,580 tokens</text>
    <text x="1068" y="330" fill="#B9BEE6" font-size="13" text-anchor="end">≈ 63 left today</text>
    <rect x="444" y="348" width="624" height="10" rx="5" fill="#0D1024"/>
    <rect x="444" y="348" width="231" height="10" rx="5" fill="url(#bar)"/>
    </g>
    <rect x="170" y="48" width="940" height="352" rx="16" fill="none" stroke="#2B3060"/>
  </g>
</svg>
